<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#E23744">
<title>Oceana — Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E23744;--red2:#CB202D;--tint:#FFF1F2;
  --ink:#10151C;--muted:#6B7684;--line:#E6E9EE;--bg:#F4F6F8;--card:#fff;
  --navy:#111A26;--navy2:#1B2736;
  --c-new:#FFF0F1;--c-new-b:#F5C2C6;--c-new-t:#C0392B;
  --c-conf:#FFF6E6;--c-conf-b:#F3DFB0;--c-conf-t:#9A6B00;
  --c-prep:#EAF3FF;--c-prep-b:#BFD8F5;--c-prep-t:#1A5FA8;
  --c-ready:#F2EEFF;--c-ready-b:#D3C7F5;--c-ready-t:#5B3FBF;
  --c-done:#EAF8EF;--c-done-b:#BEE5CC;--c-done-t:#1F8A4C;
  --warn:#F5A623;--danger:#E23744;--ok:#3AB757;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.hide{display:none!important}

#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff}
.lbox{width:100%;max-width:330px}
.lbox h1{font-family:Fraunces,serif;font-size:32px;color:var(--red);margin:0 0 2px}
.lbox p{color:var(--muted);margin:0 0 22px}
.f{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
.f:focus{border-color:var(--red);outline:none}
.btn{background:var(--red);color:#fff;padding:13px;border-radius:10px;font-weight:700;width:100%}
.btn.sm{width:auto;padding:8px 13px;border-radius:9px;font-size:13px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.err{background:var(--tint);border:1px solid #F5C6CB;color:var(--red2);padding:10px;border-radius:9px;margin-bottom:10px}

/* shell */
.shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
aside{background:var(--navy);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brandwrap{text-align:center;padding:6px 0 4px}
.tile{width:56px;height:56px;border-radius:15px;background:var(--red);color:#fff;
 font-family:Fraunces,serif;font-size:31px;font-weight:700;display:grid;place-items:center;
 margin:0 auto 12px;box-shadow:0 6px 18px rgba(226,55,68,.34)}
.brand{font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1}
.kicker{font-size:10px;letter-spacing:3px;color:var(--red);margin-top:6px;font-weight:800}
aside nav{margin-top:24px;display:flex;flex-direction:column;gap:4px;order:2}
aside nav button{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:11px;
 color:#95A3B5;font-weight:600;font-size:14px;text-align:left;width:100%;position:relative}
aside nav button:hover{background:var(--navy2);color:#fff}
aside nav button[aria-current="true"]{background:var(--navy2);color:#fff}
aside nav button[aria-current="true"]:before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;
 width:4px;border-radius:0 4px 4px 0;background:var(--red)}
.side-foot{margin-top:auto;order:3;display:flex;flex-direction:column;gap:8px;border-top:1px solid #223040;padding-top:16px}
.side-foot button{background:var(--navy2);color:#C7D2DE;padding:11px;border-radius:11px;font-size:13px;font-weight:600}
.side-foot button:hover{background:#26364a;color:#fff}
main{padding:18px 20px 40px;overflow-x:hidden}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
 margin:-18px -20px 16px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);
 position:sticky;top:0;z-index:15}
.head h1{font-size:25px;font-weight:800;margin:0;letter-spacing:-.4px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pilb{font-size:12px;font-weight:700;padding:6px 13px;border-radius:999px;background:#F1F3F6;color:var(--muted)}
.pilb.ok{background:#E8F7EE;color:#1F8A4C}
.pilb.warn{background:#FFF3E5;color:#B8730B}
.filterrow{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.flabel{font-weight:800;color:var(--muted);font-size:13.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 19px;border-radius:999px;border:1px solid var(--line);background:#fff;
 font-size:13.5px;font-weight:700;color:var(--muted);box-shadow:0 1px 2px rgba(16,21,28,.04)}
.chip:hover{border-color:#CBD3DC}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;
 box-shadow:0 1px 3px rgba(16,21,28,.05)}
.stat span{display:block;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:1.3px;
 text-transform:uppercase;margin-bottom:10px}
.stat b{display:block;font-size:40px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.stat.r b{color:var(--red)}.stat.b b{color:#1A5FA8}.stat.p b{color:#5B3FBF}.stat.o b{color:#B8730B}

/* kanban */
.board{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(252px,1fr));align-items:start}
@media(max-width:1180px){.board{grid-auto-flow:column;grid-template-columns:none;
 grid-auto-columns:minmax(252px,1fr);overflow-x:auto;padding-bottom:10px}}
.col{background:transparent;border:0;padding:0;min-height:120px}
.colbar{border-radius:14px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;
 font-weight:800;font-size:16px;letter-spacing:-.2px;margin-bottom:10px}
.colbar .cnt{background:rgba(255,255,255,.82);border-radius:999px;padding:2px 11px;font-size:13px}
.col.new .colbar{background:var(--c-new);color:var(--c-new-t);border:1px solid var(--c-new-b)}
.col.confirmed .colbar{background:var(--c-conf);color:var(--c-conf-t);border:1px solid var(--c-conf-b)}
.col.preparing .colbar{background:var(--c-prep);color:var(--c-prep-t);border:1px solid var(--c-prep-b)}
.col.ready .colbar{background:var(--c-ready);color:var(--c-ready-t);border:1px solid var(--c-ready-b)}
.col.delivered .colbar{background:var(--c-done);color:var(--c-done-t);border:1px solid var(--c-done-b)}
.colh{display:flex;align-items:center;justify-content:space-between;padding:3px 4px 9px;font-weight:800;font-size:12px;letter-spacing:.4px;text-transform:uppercase}
.col.new .colh{color:var(--c-new-t)}.col.confirmed .colh{color:var(--c-conf-t)}
.col.preparing .colh{color:var(--c-prep-t)}.col.ready .colh{color:var(--c-ready-t)}
.col.delivered .colh{color:var(--c-done-t)}
.cnt{background:rgba(255,255,255,.85);border-radius:999px;padding:2px 11px;font-size:13px;font-weight:800}
.o{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;
 box-shadow:0 2px 6px rgba(16,21,28,.06)}
.o:hover{box-shadow:0 4px 14px rgba(16,21,28,.10)}
.o.flash{animation:fl 1.6s ease}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--tint)}100%{box-shadow:0 1px 2px rgba(16,21,28,.04)}}
.orow{display:flex;justify-content:space-between;gap:9px;align-items:flex-start}
.onum{font-weight:800;font-size:14.5px}
.oamt{font-weight:800;white-space:nowrap}
.osub{color:var(--muted);font-size:12px;margin-top:2px}
.oitems{margin-top:8px;font-size:13px;line-height:1.5}
.addr{margin-top:6px;font-size:12px;color:var(--muted)}
.tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:#F1F3F6;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.tag.dl{background:#EAF3FF;color:#1A5FA8}.tag.tk{background:#FFF6E6;color:#9A6B00}
.tag.am{background:#FFEFD6;color:#9A5B00}
.tag.cx{background:#FDE8E8;color:#B42318;border:1px solid #F5C2C0}
.age{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted)}
.age.warn{color:var(--warn)}.age.bad{color:var(--danger)}
.slide{position:relative;height:42px;border-radius:10px;background:#F1F3F6;overflow:hidden;
 margin-top:10px;user-select:none;border:1px solid var(--line)}
.slide .fill{position:absolute;inset:0;width:0}
.slide .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:var(--muted);pointer-events:none}
.slide .knob{position:absolute;top:3px;left:3px;width:50px;height:34px;border-radius:8px;
 display:grid;place-items:center;color:#fff;font-weight:800;touch-action:none}
.mini{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.mini button{border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600}
.mini button.x{color:var(--red2)}
.none{padding:26px 6px;text-align:center;color:#9AA6B4;font-size:12.5px;
 background:#fff;border:1px dashed var(--line);border-radius:12px}
.drawer{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.drawer>button{width:100%;padding:12px 14px;display:flex;justify-content:space-between;font-weight:700;color:var(--muted)}
.drawer .body{border-top:1px solid var(--line);padding:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;
 padding:12px 18px;border-radius:10px;z-index:90;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.28)}

/* chat / tables reused */
.chat{display:grid;grid-template-columns:262px 1fr;gap:12px;height:calc(100vh - 170px);min-height:420px}
@media(max-width:860px){.chat{grid-template-columns:1fr}.chat.open .sessions{display:none}.chat:not(.open) .thread{display:none}}
.sessions{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
.s{padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.s[aria-selected="true"]{background:var(--tint)}
.s b{display:block;font-size:13.5px}.s small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;float:right}
.aioff{color:var(--warn);font-size:11px;font-weight:700}
.thread{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.th{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.msgs{flex:1;overflow:auto;padding:13px;background:#FAFBFC}
.m{max-width:76%;padding:9px 12px;border-radius:12px;margin-bottom:9px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.m.in{background:#fff;border:1px solid var(--line)}.m.out{background:var(--tint);margin-left:auto}
.m small{display:block;font-size:10.5px;color:var(--muted);margin-top:4px}
.compose{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line)}
.compose input{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px}
.tgl{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.sw{width:40px;height:23px;border-radius:999px;background:#D8DCE2;position:relative}
.sw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-pressed="true"]{background:var(--ok)}.sw[aria-pressed="true"] i{left:19px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{background:#FAFBFC;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:0}
.pickbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pickbar .grow{flex:1;min-width:180px}
.cbox{width:17px;height:17px;accent-color:var(--red)}
.selinfo{background:var(--tint);border:1px solid #F5C6CB;color:var(--red2);padding:9px 14px;
 border-radius:10px;font-weight:700;font-size:13px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);background:#fff}
.drop.on{border-color:var(--red);background:var(--tint)}
.srch{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:#fff}
</style>
</head>
<body>

<div id="login"><div class="lbox">
  <h1>Oceana</h1><p>Staff dashboard</p>
  <div id="lerr"></div>
  <input class="f" id="em" type="email" placeholder="Email" autocomplete="username">
  <input class="f" id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" id="lbtn">Sign in</button>
</div></div>

<div id="app" class="shell hide">
  <aside>
    <div class="brandwrap">
      <div class="tile">O</div>
      <div class="brand">Oceana</div>
      <div class="kicker">ORDER HUB</div>
    </div>
    <nav id="nav">
      <button data-v="orders" aria-current="true">🧾 Orders</button>
      <button data-v="chat">💬 Live Chat</button>
      <button data-v="menu">📋 Menu</button>
      <button data-v="stats">📊 Analytics</button>
      <button data-v="contacts">👥 Contacts</button>
      <button data-v="blast">📣 Blast</button>
    </nav>
    <div class="side-foot">
      <button id="refresh">↻ Refresh Now</button>
      <button id="sound">🔔 Enable sound</button>
      <button id="out">Sign out</button>
    </div>
  </aside>
  <main>
    <div class="head">
      <h1 id="vtitle">🧾 Orders</h1>
      <div class="pills">
        <span class="pilb ok">● Live</span>
        <span class="pilb">Updated <span id="upd">—</span></span>
        <span class="pilb warn">● Staff online</span>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
const SB='https://mvyeccwomwsgtzuxddye.supabase.co';
const KEY='sb_publishable_qdBxwwY06XTSEG5OKwCmaQ_r7KY3J5T';
const N8N='https://n8n.brightmedia.tech/webhook';
const sb=supabase.createClient(SB,KEY);
// n8n checks this token against the staff list before doing anything
async function hook(path,body){
  const {data}=await sb.auth.getSession();
  const token=data&&data.session?data.session.access_token:'';
  const r=await fetch(N8N+path,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});
  if(r.status===401){toast('Your session expired - please log in again');}
  return r;
}

// column key -> [label, css class, slide label, next status, knob colour]
const COLS=[
 ['new','New','new','Slide to accept & cook','preparing','#C0392B'],
 ['preparing','Preparing','preparing','Slide to ready / out','READY','#1A5FA8'],
 ['READY','Ready / Out','ready','Slide to delivered','delivered','#5B3FBF'],
 ['delivered','Delivered','delivered',null,null,'#1F8A4C']];
const READY=['ready_for_pickup','out_for_delivery'];
// 'confirmed' is retired; any old row still shows as New
const colOf=o=>o.status==='confirmed'?'new':(READY.indexOf(o.status)>=0?'READY':o.status);

let VIEW='orders',RANGE='today',ORDERS=[],SESSIONS=[],CUR=null,MSGS=[],SOUND=false,AGENT='Staff',FLASH=null,DRAWER=false;
const rs=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ist=t=>new Date(t).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const el=id=>document.getElementById(id);

el('lbtn').onclick=async()=>{el('lerr').innerHTML='';
 const {error}=await sb.auth.signInWithPassword({email:el('em').value.trim(),password:el('pw').value});
 if(error){el('lerr').innerHTML='<div class="err">'+esc(error.message)+'</div>';return;} start();};
el('pw').addEventListener('keydown',e=>{if(e.key==='Enter')el('lbtn').click();});
el('out').onclick=async()=>{await sb.auth.signOut();location.reload();};
el('refresh').onclick=async()=>{const b=el('refresh');b.textContent='↻ Refreshing…';
 await loadOrders();await loadSessions();render();b.textContent='↻ Refresh Now';toast('Refreshed');};
el('refresh').onclick=async()=>{const b=el('refresh');b.textContent='↻ Refreshing…';
 await loadOrders();await loadSessions();render();b.textContent='↻ Refresh Now';};
sb.auth.getSession().then(({data})=>{if(data.session)start();});

async function start(){
  const {data}=await sb.auth.getUser();
  AGENT=(data.user&&data.user.user_metadata&&data.user.user_metadata.display_name)||'Staff';
  el('login').classList.add('hide'); el('app').classList.remove('hide');
  await loadOrders(); await loadSessions(); render(); live();
  setInterval(()=>{ if(VIEW==='orders') tickAges(); },20000);
}
el('nav').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;
 VIEW=b.dataset.v;[...el('nav').children].forEach(x=>x.setAttribute('aria-current',x===b));
 el('vtitle').textContent=b.textContent; render();};

let AC=null;
el('sound').onclick=()=>{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();
 SOUND=true;el('sound').textContent='🔔 Sound on';el('sound').disabled=true;ping();};
function ping(){if(!SOUND||!AC)return;[0,.18,.36].forEach((t,i)=>{const o=AC.createOscillator(),g=AC.createGain();
 o.connect(g);g.connect(AC.destination);o.frequency.value=[784,1046,1318][i];o.type='sine';
 g.gain.setValueAtTime(.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.32,AC.currentTime+t+.02);
 g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.26);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.3);});}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;
 document.body.appendChild(d);setTimeout(()=>d.remove(),3400);}

function rangeStart(){
  const n=new Date(), ist=new Date(n.getTime()+(n.getTimezoneOffset()*60000)+19800000);
  const midnight=new Date(ist); midnight.setHours(0,0,0,0);
  const off=midnight.getTime()-19800000-(n.getTimezoneOffset()*60000);
  if(RANGE==='today') return new Date(off);
  if(RANGE==='yesterday') return new Date(off-86400000);
  if(RANGE==='week') return new Date(off-6*86400000);
  if(RANGE==='month') return new Date(off-29*86400000);
  return new Date(0);
}
function inRange(o){
  const t=new Date(o.created_at).getTime(), s=rangeStart().getTime();
  if(RANGE==='yesterday') return t>=s && t<s+86400000;
  return t>=s;
}

async function loadOrders(){
  const {data}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(300);
  ORDERS=data||[]; el('upd').textContent=new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
async function loadSessions(){
  const {data}=await sb.from('chat_sessions').select('*').order('last_message_at',{ascending:false,nullsFirst:false}).limit(80);
  SESSIONS=data||[];}
async function loadMsgs(p){const {data}=await sb.from('messages').select('*').eq('phone',p).order('created_at').limit(200);MSGS=data||[];}

function live(){
  sb.channel('o').on('postgres_changes',{event:'*',schema:'public',table:'orders'},async p=>{
    if(p.eventType==='INSERT'&&p.new.status!=='draft'){FLASH=p.new.order_number;ping();
      toast('New order '+p.new.order_number+' · '+rs(p.new.total));}
    else if(p.eventType==='UPDATE'&&p.new.amendment_count>(p.old&&p.old.amendment_count||0)){
      FLASH=p.new.order_number;ping();toast(p.new.order_number+' was amended by the customer');}
    else if(p.eventType==='UPDATE'&&p.new.cancel_requested_at&&p.new.cancel_requested_at!==(p.old&&p.old.cancel_requested_at)){
      FLASH=p.new.order_number;ping();toast(p.new.order_number+': customer asked to cancel - please call them');}
    else if(p.eventType==='UPDATE'&&p.new.status==='new'&&p.old&&p.old.status==='draft'){
      FLASH=p.new.order_number;ping();toast('New order '+p.new.order_number+' · '+rs(p.new.total));}
    await loadOrders(); if(VIEW==='orders')render();}).subscribe();

function initSlide(box){
  const knob=box.querySelector('.knob'),fill=box.querySelector('.fill'),lbl=box.querySelector('.lbl');
  const base=lbl.textContent; let x0=null,max=0;
  const down=e=>{x0=(e.touches?e.touches[0].clientX:e.clientX);max=box.clientWidth-knob.clientWidth-6;
   document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
   document.addEventListener('touchmove',mv,{passive:false});document.addEventListener('touchend',up);};
  const mv=e=>{if(x0===null)return;if(e.cancelable)e.preventDefault();
   const d=Math.max(0,Math.min(max,(e.touches?e.touches[0].clientX:e.clientX)-x0));
   knob.style.left=(3+d)+'px';fill.style.width=(d+50)+'px';
   lbl.textContent=d>max*.55?'Release':base;};
  const up=()=>{const d=parseInt(knob.style.left||'3')-3;
   document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
   document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up);
   if(d>max*.55){lbl.textContent='Updating…';
     let next=box.dataset.next;
     if(next==='READY'){const o=ORDERS.find(x=>x.order_number===box.dataset.o);
       next=(o&&o.order_type==='delivery')?'out_for_delivery':'ready_for_pickup';}
     setStatus(box.dataset.o,next);}
   else{knob.style.left='3px';fill.style.width='0';lbl.textContent=base;}
   x0=null;};
  knob.addEventListener('mousedown',down);knob.addEventListener('touchstart',down,{passive:true});
}
async function setStatus(num,status){

function cleanNum(raw){
  let p=String(raw||'').replace(/[^0-9]/g,'');
  if(!p) return '';
  if(p.length===11&&p[0]==='0') return '91'+p.slice(1);
  if(p.length===10&&'6789'.indexOf(p[0])>=0) return '91'+p;
  if(p.length===12&&p.slice(0,2)==='91') return p;
  return p.length>=10?p:'';
}

async function doImport(text){

  const {error}=await sb.from('customers').upsert(rows,{onConflict:'phone',ignoreDuplicates:true});
  if(error){res.innerHTML='<div class="err">'+esc(error.message)+'</div>';return;}
  res.innerHTML='<div class="stat" style="padding:12px 16px"><span>Imported</span><b>'+rows.length+'</b></div>';

  CUSTOMERS=[];await loadCustomers();
  rows.forEach(r=>PICK.add(r.phone));
  toast(rows.length+' numbers added and selected');
  vContacts();
}

    <input class="f" id="bt" value="oceana_promo_en">
    <label style="font-size:12px;font-weight:700;color:var(--muted)">Header image URL</label>
    <input class="f" id="bi" placeholder="https://… .png" value="${esc(SET_HDR)}">
    <div style="font-size:12px;color:var(--muted);margin:-4px 0 12px">
      Templates with an image header require an image on every send — Meta treats the one you
      uploaded as a sample only. Put your offer creative on a public URL and paste it here.</div>
    <div class="err" style="background:#FFF8E5;border-color:#F3DFA8;color:#7A5A00">
      The template must already be approved in Meta, and this workflow must be active in n8n.
      Sends about one per second — leave this tab open.</div>
    <button class="btn" id="bgo">Send blast</button><div id="bres" style="margin-top:12px"></div>`;
  const c=el('clr'); if(c) c.onclick=()=>{PICK.clear();vBlast();};
  const g=el('goc'); if(g) g.onclick=()=>{VIEW='contacts';
    [...el('nav').children].forEach(x=>x.setAttribute('aria-current',x.dataset.v==='contacts'));
    el('vtitle').textContent='Contacts';render();};
  el('bgo').onclick=async()=>{const b=el('bgo');b.disabled=true;b.textContent='Sending…';
    try{const r=await hook('/oceana-blast',{filter:el('bf').disabled?'all':el('bf').value,
        template_name:el('bt').value.trim(),language:'en',
        header_image:el('bi').value.trim(),
        phones:[...PICK]});
     const j=await r.json();
     el('bres').innerHTML=`<div class="stat ${j.sent?'c3':'c1'}"><span>Sent of ${j.attempted||0}</span><b>${j.sent||0}</b></div>`
       +(j.error?`<div class="err" style="margin-top:10px"><b>Meta says:</b> ${esc(j.error)}</div>`:'');
     if(el('bi').value.trim()&&el('bi').value.trim()!==SET_HDR){
       await sb.from('settings').upsert({key:'blast_header_image',value:el('bi').value.trim()},{onConflict:'key'});
       SET_HDR=el('bi').value.trim();}}
    catch(e){el('bres').innerHTML='<div class="err">Blast did not complete. Check the workflow is active in n8n.</div>';}
    b.disabled=false;b.textContent='Send blast';};
}
</script>
</body>
</html>
